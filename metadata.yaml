name: astrbot_plugin_game_kb
display_name: 游戏知识库
desc: 通用游戏文本知识库框架；支持东方、Blue Archive、Project SEKAI，BA 增加多源剧情抓取与不完整库自动修复
help: |
  插件加载后会自动创建/复用启用的知识库，不需要初始化指令。
  常用指令：
  1. /游戏知识库状态 [touhou|ba|pjsk]
  2. /游戏知识库同步 <touhou|ba|pjsk> [数量] [入口/路径关键词]
  3. /游戏知识库搜索 <touhou|ba|pjsk> <关键词>
  4. /游戏知识库绑定人格 <touhou|ba|pjsk> [persona_id]
  5. /游戏知识库人格列表
author: YunMo-yanyu, lxlonlyn
version: 0.6.1
repo: https://github.com/lxlonlyn/astrbot-game-kb
keywords:
  - 东方Project
  - Blue Archive
  - Project SEKAI
  - 知识库
  - RAG
  - 游戏
